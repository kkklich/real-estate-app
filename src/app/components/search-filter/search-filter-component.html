<div class="selects-container">
    <mat-button-toggle-group class="city-toggle" aria-label="City" hideSingleSelectionIndicator
        [value]="city()" (change)="cityChange.emit($event.value)">
        @for (option of cities; track option.value) {
        <mat-button-toggle [value]="option.value">{{ option.label }}</mat-button-toggle>
        }
    </mat-button-toggle-group>
</div>
